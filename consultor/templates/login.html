{% extends "base.html" %}

{% block title %}Inicio de Sesión - {{ app_name }}{% endblock %}

{% block content %}

<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 60px;
    }

    .login-card {
        width: 360px;
        padding: 35px 30px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        text-align: center;
        animation: fadeIn 0.5s ease-in-out;
        border: 1px solid #e7e7e7;
    }

    .login-title {
        font-size: 24px;
        font-weight: bold;
        color: #2f6670;
        margin-bottom: 5px;
    }

    .login-subtitle {
        font-size: 14px;
        color: #666;
        margin-bottom: 20px;
    }

    .login-input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d2d2d2;
        border-radius: 8px;
        margin-top: 6px;
        font-size: 15px;
        transition: all .2s;
    }

    .login-input:focus {
        border-color: #308282;
        box-shadow: 0 0 5px rgba(48,130,130,.4);
        outline: none;
    }

    .login-label {
        text-align: left;
        width: 100%;
        font-weight: 600;
        color: #444;
        font-size: 14px;
    }

    .login-button {
        width: 100%;
        padding: 12px;
        background-color: #308282;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 15px;
        transition: background .2s;
    }

    .login-button:hover {
        background-color: #256d6d;
    }

    .error-message {
        color: #b30000;
        font-weight: bold;
        margin-bottom: 15px;
        background: #ffe5e5;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #ffb3b3;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>


<div class="login-container">
    <div class="login-card">

        <h1 class="login-title">Inicio de Sesión</h1>
        <p class="login-subtitle">Aplicación: <b>{{ app_name }}</b></p>

        {% if error_message %}
            <p class="error-message">{{ error_message }}</p>
        {% endif %}

        <form method="post" action="">
            {% csrf_token %}

            <div style="margin-bottom: 15px;">
                <label class="login-label" for="username">Usuario:</label>
                <input type="text" id="username" name="username" class="login-input" required>
            </div>

            <div style="margin-bottom: 20px;">
                <label class="login-label" for="password">Contraseña:</label>
                <input type="password" id="password" name="password" class="login-input" required>
            </div>

            <button type="submit" class="login-button">Iniciar Sesión</button>
        </form>
    </div>
</div>

{% endblock %}
