{% extends "base.html" %}

{% block title %}Inicio de Sesión - {{ app_name }}{% endblock %}

{% block content %}
<div style="text-align: center; margin-top: 50px;">
    <h1>Inicio de Sesión de la Aplicación: **{{ app_name }}**</h1>
    <p>Por favor, introduzca sus credenciales (simulación).</p>

    <form method="post" action="" style="max-width: 300px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
        {% csrf_token %} 
        
        <div style="margin-bottom: 10px;">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" style="width: 100%; padding: 8px;" required>
        </div>
        <div style="margin-bottom: 20px;">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" style="width: 100%; padding: 8px;" required>
        </div>
        <button type="submit" style="padding: 10px 15px; background-color: #308282; color: white; border: none; border-radius: 4px; cursor: pointer;">Iniciar Sesión</button>
    </form>
</div>
{% endblock %}
