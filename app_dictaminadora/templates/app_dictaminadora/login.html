{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio de Sesión - {{ app_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'app_dictaminadora/css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="app-icon">
                    <i class="bi bi-people"></i>
                </div>
                <h1>{{ app_name }}</h1>
                <p>Sistema de Gestión Documental</p>
            </div>
            
            <div class="login-body">
                {% if error_message %}
                <div class="error-message">
                    <i class="bi bi-exclamation-circle me-2"></i>{{ error_message }}
                </div>
                {% endif %}
                
                <form method="post" action="">
                    {% csrf_token %}
                    
                    <div class="form-floating">
                        <input type="text" class="form-control" id="username" name="username" 
                               placeholder="Usuario" required autofocus>
                        <label for="username"><i class="bi bi-person me-2"></i>Usuario</label>
                    </div>
                    
                    <div class="form-floating">
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="Contraseña" required>
                        <label for="password"><i class="bi bi-lock me-2"></i>Contraseña</label>
                    </div>
                    
                    <button type="submit" class="btn btn-login btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
        
        <div class="back-link">
            <a href="/"><i class="bi bi-arrow-left me-2"></i>Volver al menú principal</a>
        </div>
    </div>
</body>
</html>
