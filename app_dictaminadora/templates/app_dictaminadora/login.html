<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio de Sesión - {{ app_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #c45c26 0%, #e07b3c 50%, #f5a66a 100%);
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }
        
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .login-header {
            background: linear-gradient(135deg, #c45c26 0%, #e07b3c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .login-header p {
            opacity: 0.9;
            margin: 0;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .form-floating {
            margin-bottom: 20px;
        }
        
        .form-control:focus {
            border-color: #e07b3c;
            box-shadow: 0 0 0 0.2rem rgba(224, 123, 60, 0.25);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #c45c26 0%, #e07b3c 100%);
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(224, 123, 60, 0.4);
            background: linear-gradient(135deg, #a84d1f 0%, #c96a30 100%);
        }
        
        .error-message {
            background: #ffe5e5;
            border: 1px solid #ffb3b3;
            color: #b30000;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: white;
            text-decoration: none;
            opacity: 0.9;
        }
        
        .back-link a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .app-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="app-icon">
                    <i class="bi bi-people"></i>
                </div>
                <h1>{{ app_name }}</h1>
                <p>Sistema de Gestión Documental</p>
            </div>
            
            <div class="login-body">
                {% if error_message %}
                <div class="error-message">
                    <i class="bi bi-exclamation-circle me-2"></i>{{ error_message }}
                </div>
                {% endif %}
                
                <form method="post" action="">
                    {% csrf_token %}
                    
                    <div class="form-floating">
                        <input type="text" class="form-control" id="username" name="username" 
                               placeholder="Usuario" required autofocus>
                        <label for="username"><i class="bi bi-person me-2"></i>Usuario</label>
                    </div>
                    
                    <div class="form-floating">
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="Contraseña" required>
                        <label for="password"><i class="bi bi-lock me-2"></i>Contraseña</label>
                    </div>
                    
                    <button type="submit" class="btn btn-login btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
        
        <div class="back-link">
            <a href="/"><i class="bi bi-arrow-left me-2"></i>Volver al menú principal</a>
        </div>
    </div>
</body>
</html>
